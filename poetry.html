
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poetry | EARENDEL</title>

<meta name="description" content="Explore poetry, emotions and words from EARENDEL.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap');

:root {
  --bg: #08090d;
  --card: #151519;
  --gold: #d6b875;
  --gold-light: #c7a86b;
  --text: #eee9df;
  --muted: #aaa69e;
  --border: #292720;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif Bengali', serif;
  min-height: 100vh;
}

a {
  text-decoration: none;
}

/* HEADER */

header {
  padding: 24px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: #08090d;
}

.logo {
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  letter-spacing: 5px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
}

nav a {
  color: var(--muted);
  font-size: 14px;
  transition: 0.3s;
}

nav a:hover,
nav a.active {
  color: var(--gold);
}

/* HERO */

.hero {
  text-align: center;
  padding: 100px 20px 70px;
  background:
    radial-gradient(
      ellipse at center,
      #25201c 0%,
      #111016 40%,
      #08090d 75%
    );
}

.hero small {
  color: var(--gold-light);
  letter-spacing: 5px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
}

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(60px, 10vw, 105px);
  font-weight: 400;
  margin: 15px 0;
  color: #eee9df;
}

.hero p {
  color: var(--muted);
  font-size: 15px;
}

/* SEARCH */

.search {
  max-width: 500px;
  margin: 35px auto 0;
}

.search input {
  width: 100%;
  padding: 16px 22px;
  background: #111217;
  border: 1px solid #37332b;
  border-radius: 30px;
  color: white;
  outline: none;
  font-family: inherit;
  font-size: 14px;
  transition: 0.3s;
}

.search input:focus {
  border-color: var(--gold-light);
  box-shadow: 0 0 15px #c7a86b15;
}

.search input::placeholder {
  color: #77736c;
}

/* MAIN */

.container {
  max-width: 1150px;
  margin: auto;
  padding: 65px 25px 100px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 35px;
}

.section-title {
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 400;
}

.section-subtitle {
  color: #77736c;
  font-size: 12px;
}

/* POETRY GRID */

.poetry-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(100%, 280px), 1fr)
  );
  gap: 25px;
}

/* POEM CARD */

.poem-card {
  background: linear-gradient(145deg, #17171a, #101115);
  border: 1px solid var(--border);
  padding: 32px;
  border-radius: 5px;
  transition: transform 0.3s, border-color 0.3s;
  min-width: 0;
}

.poem-card:hover {
  transform: translateY(-5px);
  border-color: #8b7047;
}

.category {
  color: var(--gold-light);
  font-size: 12px;
  letter-spacing: 2px;
}

.poem-card h2 {
  font-size: 23px;
  font-weight: 500;
  margin: 18px 0;
  color: #eee9df;
  overflow-wrap: anywhere;
}

.poem-card p {
  color: #b8b2a8;
  line-height: 2.1;
  font-size: 14px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.poem-card button {
  margin-top: 25px;
  background: transparent;
  border: 1px solid #75603e;
  color: var(--gold);
  padding: 11px 20px;
  cursor: pointer;
  font-family: inherit;
  transition: 0.3s;
}

.poem-card button:hover {
  background: var(--gold-light);
  color: #08090d;
}

/* EMPTY / LOADING */

.message {
  display: none;
  text-align: center;
  color: var(--muted);
  padding: 35px 15px;
  line-height: 2;
}

.message.visible {
  display: block;
}

.message.error {
  color: #d7a49a;
}

/* QUOTE */

.quote {
  margin-top: 90px;
  padding: 55px 25px;
  text-align: center;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.quote p {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(23px, 4vw, 34px);
  color: var(--gold);
  line-height: 1.7;
}

.quote span {
  display: block;
  color: #77736c;
  margin-top: 18px;
  font-size: 12px;
  letter-spacing: 2px;
}

/* FOOTER */

footer {
  padding: 30px 20px;
  text-align: center;
  color: #77736c;
  font-size: 13px;
  border-top: 1px solid #19191c;
}

footer a {
  color: var(--gold-light);
}

/* MOBILE */

@media (max-width: 650px) {
  header {
    flex-direction: column;
    gap: 20px;
    padding: 22px 15px;
  }

  .logo {
    font-size: 27px;
  }

  nav {
    justify-content: center;
    gap: 16px;
  }

  nav a {
    font-size: 12px;
  }

  .hero {
    padding: 75px 20px 55px;
  }

  .hero small {
    letter-spacing: 3px;
  }

  .container {
    padding: 45px 18px 70px;
  }

  .section-heading {
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }

  .section-title {
    font-size: 32px;
  }

  .poem-card {
    padding: 25px;
  }

  .quote {
    margin-top: 60px;
    padding: 40px 15px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <a class="logo" href="index.html">EARENDEL</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="poetry.html" class="active">Poetry</a>
    <a href="stories.html">Stories</a>
    <a href="novels.html">Novels</a>
    <a href="about.html">About</a>
  </nav>

</header>

<!-- HERO -->

<section class="hero">

  <small>WORDS FROM THE HEART</small>

  <h1>Poetry</h1>

  <p>কিছু অনুভূতি শব্দ হয়ে বেঁচে থাকুক...</p>

  <div class="search">

    <input
      type="text"
      id="searchInput"
      placeholder="কবিতার নাম খুঁজুন..."
      oninput="searchPoems()"
      autocomplete="off"
    >

  </div>

</section>

<!-- MAIN -->

<main class="container">

  <div class="section-heading">

    <h2 class="section-title">কবিতার সংগ্রহ</h2>

    <span class="section-subtitle" id="poemCount">
      EARENDEL COLLECTION
    </span>

  </div>

  <!-- Supabase থেকে কবিতা এখানে আসবে -->

  <div class="poetry-grid" id="poetryGrid"></div>

  <!-- Loading / Empty / Error Message -->

  <p class="message visible" id="emptyMessage">
    কবিতা লোড হচ্ছে...
  </p>

  <!-- QUOTE -->

  <section class="quote">

    <p>
      “কিছু কথা বলা হয় না,<br>
      তবু সারাজীবন থেকে যায়।”
    </p>

    <span>— EARENDEL</span>

  </section>

</main>

<!-- FOOTER -->

<footer>

  © 2026 EARENDEL ·

  <a href="index.html">Back to Home</a>

</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script>

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const grid = document.getElementById("poetryGrid");

const emptyMessage = document.getElementById("emptyMessage");

const poemCount = document.getElementById("poemCount");


let allPoems = [];


/* LOAD PUBLISHED POEMS */

async function loadPoems() {

  grid.innerHTML = "";

  emptyMessage.className = "message visible";

  emptyMessage.textContent = "কবিতা লোড হচ্ছে...";

  try {

    const { data, error } = await db

      .from("posts")

      .select("title, category, content, created_at")

      .eq("category", "poetry")

      .eq("status", "published")

      .order("created_at", { ascending: false });


    if (error) {

      console.error("Supabase error:", error);

      emptyMessage.className = "message visible error";

      emptyMessage.textContent =
        "কবিতা লোড করা যায়নি। একটু পরে আবার চেষ্টা করো।";

      poemCount.textContent = "COLLECTION";

      return;

    }


    allPoems = data || [];

    poemCount.textContent =
      allPoems.length + " POEMS";


    if (allPoems.length === 0) {

      emptyMessage.className = "message visible";

      emptyMessage.textContent =
        "এখনো কোনো Published কবিতা নেই।";

      return;

    }


    emptyMessage.className = "message";

    renderPoems(allPoems);

  } catch (error) {

    console.error("Unexpected error:", error);

    emptyMessage.className = "message visible error";

    emptyMessage.textContent =
      "কবিতা লোড করতে সমস্যা হয়েছে।";

  }

}


/* DISPLAY POEMS */

function renderPoems(poems) {

  grid.innerHTML = "";

  if (!poems || poems.length === 0) {

    emptyMessage.className = "message visible";

    emptyMessage.textContent =
      "এই নামে কোনো কবিতা পাওয়া যায়নি।";

    return;

  }


  emptyMessage.className = "message";


  poems.forEach(function(poem) {

    const card = document.createElement("article");

    card.className = "poem-card";


    const category = document.createElement("span");

    category.className = "category";

    category.textContent = poem.category || "কবিতা";


    const title = document.createElement("h2");

    title.textContent = poem.title || "Untitled";


    const content = document.createElement("p");

    content.textContent = poem.content || "";


    const button = document.createElement("button");

    button.type = "button";

    button.textContent = "কবিতাটি পড়ুন";


    button.addEventListener("click", function() {

      showPoem(poem);

    });


    card.appendChild(category);

    card.appendChild(title);

    card.appendChild(content);

    card.appendChild(button);


    grid.appendChild(card);

  });

}


/* READ FULL POEM */

function showPoem(poem) {

  alert(
    (poem.title || "Untitled") +
    "\n\n" +
    (poem.content || "")
  );

}


/* SEARCH POEMS */

function searchPoems() {

  const input = document.getElementById("searchInput");

  const search = input.value.trim().toLowerCase();


  const filteredPoems = allPoems.filter(function(poem) {

    const title = (poem.title || "").toLowerCase();

    const content = (poem.content || "").toLowerCase();

    const category = (poem.category || "").toLowerCase();


    return (

      title.includes(search) ||

      content.includes(search) ||

      category.includes(search)

    );

  });


  renderPoems(filteredPoems);

}


/* START */

loadPoems();

</script>

</body>
</html>
